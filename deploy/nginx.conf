# Place in nginx's http context, e.g. /etc/nginx/conf.d/codex-lb.conf.
# codex-lb listens on loopback:2455; configure TLS before public exposure.
map $http_upgrade $codex_lb_connection {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:2455;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $codex_lb_connection;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
