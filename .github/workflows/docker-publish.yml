name: Fork release artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. v1.25.2-beta.1"
        required: true
        type: string

# Serialize releases across different tags; never cancel an active upload.
concurrency:
  group: fork-release-publication
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  source-gate:
    if: github.repository == 'Frozen811/codex-lb'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      image: ${{ steps.source.outputs.image }}
      is_prerelease: ${{ steps.source.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Require successful exact-source CI
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.sha }}
        run: python3 -m scripts.guard_fork_release --tag "$RELEASE_TAG" --expected-sha "$EVENT_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - name: Verify every managed version
        run: python3 -m scripts.verify_release_version --tag "$RELEASE_TAG"

  build-and-publish:
    needs: source-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      actions: read
    env:
      SOURCE_SHA: ${{ needs.source-gate.outputs.sha }}
      RELEASE_VERSION: ${{ needs.source-gate.outputs.version }}
      IMAGE: ${{ needs.source-gate.outputs.image }}
      IS_PRERELEASE: ${{ needs.source-gate.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source-gate.outputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.13"
          enable-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Build dashboard and packages
        run: |
          cd frontend
          bun install --frozen-lockfile
          bun run build
          cd ..
          uv build --out-dir dist
          python -m scripts.verify_release_artifacts --tag "$RELEASE_TAG"
      - name: Smoke installed wheel and sdist outside checkout
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            smoke_env=$(mktemp -d)
            uv venv "$smoke_env/venv" --python 3.13
            uv pip install --python "$smoke_env/venv/bin/python" "$artifact"
            python -m scripts.smoke_release --python "$smoke_env/venv/bin/python" --version "$RELEASE_VERSION"
          done
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Build local candidate without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: codex-lb-release:validated
          labels: |
            org.opencontainers.image.version=${{ needs.source-gate.outputs.version }}
            org.opencontainers.image.revision=${{ needs.source-gate.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=fork-release
          cache-to: type=gha,mode=max,scope=fork-release
      - name: Smoke isolated image and check identity
        run: |
          test "$(docker image inspect codex-lb-release:validated --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          test "$(docker image inspect codex-lb-release:validated --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$RELEASE_VERSION"
          test "$(docker image inspect codex-lb-release:validated --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SOURCE_SHA"
          test "$(docker run --rm --entrypoint python codex-lb-release:validated -c 'import app; print(app.__version__)')" = "$RELEASE_VERSION"
          trap 'docker rm -f codex-lb-release-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name codex-lb-release-smoke --tmpfs /var/lib/codex-lb:uid=1000,gid=1000 \
            -p 127.0.0.1::2455 codex-lb-release:validated
          smoke_port=$(docker port codex-lb-release-smoke 2455/tcp | cut -d: -f2)
          python -m scripts.smoke_release --base-url "http://127.0.0.1:$smoke_port" || { docker logs codex-lb-release-smoke; exit 1; }
      - name: Recheck source and CI immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m scripts.guard_fork_release --tag "$RELEASE_TAG" --expected-sha "$SOURCE_SHA" --provenance-out dist/release-provenance.json
          python -m scripts.verify_release_artifacts --tag "$RELEASE_TAG"
      - name: Log in to GHCR after all gates
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Refuse existing exact image tags
        run: |
          for tag in "$RELEASE_TAG" "$RELEASE_VERSION"; do
            if docker buildx imagetools inspect "$IMAGE:$tag" >inspect.out 2>inspect.err; then
              echo "::error::Exact image tag already exists: $IMAGE:$tag"
              exit 1
            fi
            if ! grep -Eqi 'manifest unknown|not found|no such manifest' inspect.err; then
              cat inspect.err
              exit 1
            fi
          done
      - name: Upload validated packages and provenance without clobber
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY"
      - name: Push exact image tags before stable aliases
        run: |
          for tag in "$RELEASE_TAG" "$RELEASE_VERSION"; do
            docker tag codex-lb-release:validated "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          if [ "$IS_PRERELEASE" = false ]; then
            for tag in latest "${RELEASE_VERSION%%.*}" "${RELEASE_VERSION%.*}"; do
              docker tag codex-lb-release:validated "$IMAGE:$tag"
              docker push "$IMAGE:$tag"
            done
          fi
      - name: Advertise completed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$IS_PRERELEASE" = true ]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          fi

  withdraw-failed-release:
    needs: [source-gate, build-and-publish]
    if: >-
      ${{ always() && github.repository == 'Frozen811/codex-lb' &&
          (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Make incomplete release draft again
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft
