name: Windows Startup Regression

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-windows-startup:
    name: Windows startup regression
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.13"
          enable-cache: true
          prune-cache: true

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Verify editable setup leaves frontend compilation explicit
        run: |
          if (Test-Path "app/static/index.html") {
            throw "Editable dependency setup unexpectedly compiled the dashboard"
          }

      - name: Run portability regression tests
        run: uv run pytest tests/unit/test_memory_monitor.py tests/unit/test_check_proxy_architecture.py tests/unit/test_proxy_header_launcher_contract.py -q

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Build dashboard
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run build

      - name: Smoke installed wheel outside checkout
        run: |
          $candidateRoot = Join-Path $env:RUNNER_TEMP "codex-lb-windows-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $packageDir = Join-Path $candidateRoot "dist"
          $venvDir = Join-Path $candidateRoot "venv"
          uv build --wheel --out-dir $packageDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv venv $venvDir --python 3.13
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $candidatePython = Join-Path $venvDir "Scripts/python.exe"
          $wheel = @(Get-ChildItem -LiteralPath $packageDir -Filter "*.whl")
          if ($wheel.Count -ne 1) { throw "Expected exactly one candidate wheel" }
          uv pip install --no-cache --link-mode copy --python $candidatePython $wheel[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = uv run python -c "import app; print(app.__version__)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run python -m scripts.smoke_release --python $candidatePython --version $version
