# Server-only Docker Compose — source build, SQLite or external PostgreSQL
# Usage:
#   # Optional: create .env.local with overrides (see docs/deployment/docker.md)
#   docker compose -f docker-compose.prod.yml up -d
#
# SQLite persists in the named volume by default. To use external PostgreSQL,
# set CODEX_LB_DATABASE_URL in .env.local (localhost refers to this container):
#   CODEX_LB_DATABASE_URL=postgresql+asyncpg://user:password@host:5432/codexlb
#
# NOTE: This Compose file defines a SINGLE-REPLICA topology.
# Do not use `docker compose up --scale server=N` — the published host ports collide
# and Compose provides no per-replica bridge identity. Multi-replica deployments
# require the Helm chart with PostgreSQL and leader election (deploy/helm/codex-lb).
services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    # Always build this checkout; never label local source as an official release.
    image: codex-lb:local
    pull_policy: build
    env_file:
      - path: .env.local
        required: false
    ports:
      - "2455:2455"
      - "1455:1455"
    volumes:
      - codex-lb-data:/var/lib/codex-lb
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2455/health/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

networks:
  default:
    driver: bridge

volumes:
  codex-lb-data:
    name: codex-lb-data
