# Production Docker Compose for codex-lb (Hardened Community Edition)
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
services:
  codex-lb:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/frozen811/codex-lb:1.25.0
    container_name: codex-lb
    ports:
      - "2455:2455"
      - "1455:1455"
    volumes:
      - codex-lb-data:/var/lib/codex-lb
    restart: unless-stopped

volumes:
  codex-lb-data:
